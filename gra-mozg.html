<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gimnastyka umysłu</title>
<style>
  :root { --bg:#eef6f3; --card:#fff; --ink:#2f4858; --accent:#7bb6a4; --ok:#d6f0d9; --warn:#fdf1d6; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
         font-family:"Trebuchet MS",Verdana,sans-serif; display:flex; flex-direction:column; align-items:center; }
  button { font:inherit; color:inherit; cursor:pointer; border:none; }
  button:focus-visible { outline:4px solid var(--accent); }
  header { width:100%; max-width:760px; display:flex; justify-content:space-between; padding:12px 16px; }
  .small { background:var(--card); border-radius:14px; padding:10px 16px; font-size:1.05rem; box-shadow:0 2px 6px #0001; }
  main { width:100%; max-width:760px; padding:4px 16px 32px; text-align:center; }
  h1 { font-size:2rem; margin:8px 0 20px; }
  .hidden { display:none !important; }

  .menu { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:520px){ .menu { grid-template-columns:1fr; } }
  .card { background:var(--card); border-radius:24px; padding:14px; box-shadow:0 4px 10px #0001; }
  .card .go { width:100%; background:none; font-size:1.5rem; padding:10px 4px; }
  .card .desc { font-size:.95rem; opacity:.75; margin-bottom:8px; }
  .lv { display:flex; align-items:center; justify-content:center; gap:10px; font-size:1rem; }
  .lv button { background:var(--bg); border-radius:10px; width:36px; height:36px; font-size:1.1rem; }

  .bar { display:flex; justify-content:space-between; font-size:1.05rem; opacity:.8; margin:4px 4px 12px; }
  .q { font-size:min(9vw,2.6rem); background:var(--card); border-radius:28px; padding:22px 14px;
       box-shadow:0 4px 10px #0001; margin-bottom:14px; line-height:1.5; }
  .box { display:inline-block; min-width:1.4em; border:3px dashed var(--accent); border-radius:10px; padding:0 6px; }
  .ans { font-size:2.4rem; min-height:4.2rem; background:var(--card); border-radius:20px; padding:10px;
         border:4px solid var(--soft,#cfe5dd); margin-bottom:12px; }
  .ans.ok, .tile.ok { background:var(--ok); }
  .ans.try, .try { animation:wobble .5s; background:var(--warn); }
  .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:380px; margin:0 auto; }
  .key { background:var(--card); border-radius:18px; font-size:1.8rem; padding:14px 0; box-shadow:0 3px 8px #0001; }
  .key.go { background:var(--accent); color:#fff; }
  .opts { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
  .opt { background:var(--card); border-radius:24px; font-size:3rem; padding:18px 40px; box-shadow:0 4px 10px #0001; }
  .opt:disabled { opacity:.35; cursor:default; }
  .slots, .tiles { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-bottom:14px; }
  .slot { width:2.4rem; height:3rem; border-bottom:4px solid var(--accent); font-size:2rem; }
  .tile { background:var(--card); border-radius:14px; font-size:1.8rem; width:3.2rem; height:3.4rem; box-shadow:0 3px 8px #0001; }
  .tile:disabled { opacity:.25; cursor:default; }
  .tile.hint { outline:4px solid var(--accent); }
  .seqgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; max-width:420px; margin:0 auto; }
  .seqgrid.six { grid-template-columns:repeat(3,1fr); }
  .st { height:110px; border-radius:24px; box-shadow:0 4px 10px #0001; transition:transform .25s, outline-color .25s; outline:6px solid transparent; }
  .st.lit { transform:scale(1.08); outline-color:var(--ink); }
  .oddgrid { display:grid; gap:6px; max-width:520px; margin:0 auto; }
  .cell { background:var(--card); border-radius:12px; padding:0; aspect-ratio:1; box-shadow:0 2px 5px #0001; }
  .cell:disabled { opacity:.3; cursor:default; }
  .msg { font-size:1.4rem; min-height:2.2rem; margin-top:16px; }
  .big { font-size:6rem; }
  @keyframes wobble { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  @media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
</style>
</head>
<body>
<header>
  <button class="small" id="back">⬅ Menu</button>
  <button class="small" id="snd">🔊 Dźwięk</button>
</header>
<main>
  <section id="menu">
    <h1>Gimnastyka umysłu 🧠</h1>
    <div class="menu" id="menuGrid"></div>
    <p style="opacity:.7;font-size:.95rem">Bez limitu czasu. Trudność dopasowuje się sama – ▼ ▲ pozwalają ustawić poziom startowy.</p>
  </section>

  <section id="game" class="hidden">
    <div class="bar"><span id="prog"></span><span id="lvl"></span></div>
    <div id="stage"></div>
    <div class="msg" id="msg"></div>
  </section>

  <section id="end" class="hidden">
    <div class="big">🌟</div>
    <h1 id="endTitle"></h1>
    <p id="endText" style="font-size:1.3rem"></p>
    <div class="menu">
      <button class="small" id="again" style="font-size:1.4rem;padding:18px">▶ Jeszcze raz</button>
      <button class="small" id="tomenu" style="font-size:1.4rem;padding:18px">🏠 Menu</button>
    </div>
  </section>
</main>

<script>
const TASKS = 8;
const $ = id => document.getElementById(id);
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[rnd(0, a.length - 1)];
const shuffle = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(p => p[1]);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const PRAISE = ["Super! 🌟", "Świetnie! 🎉", "Brawo! 👏", "Doskonale! ✨", "Bardzo dobrze! 😊"];
const stage = $("stage");

let sound = true, ctx, key, level, idx, stars, streak, bad, keyHandler = null, token = 0;

/* ---------- pomocnicze ---------- */
function load(k) { try { return +localStorage.getItem("lvl_" + k) || 1; } catch (e) { return 1; } }
function save(k, v) { try { localStorage.setItem("lvl_" + k, v); } catch (e) {} }
function tone(freqs) {
  if (!sound) return;
  try {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + i * 0.16;
      o.type = "sine"; o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.1, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35); o.start(t); o.stop(t + 0.4);
    });
  } catch (e) {}
}
function show(id) { ["menu", "game", "end"].forEach(s => $(s).classList.toggle("hidden", s !== id)); }
function setMsg(t) { $("msg").textContent = t; }
function wobble(el) { el.classList.add("try"); setTimeout(() => el.classList.remove("try"), 550); }

/* ---------- silnik sesji ---------- */
function startMode(k) { key = k; level = load(k); idx = 0; stars = 0; streak = 0; bad = 0; show("game"); nextTask(); }
function nextTask() {
  token++; keyHandler = null;
  if (idx >= TASKS) return endSession();
  idx++; setMsg("");
  $("prog").textContent = `Zadanie ${idx} z ${TASKS}`;
  $("lvl").textContent = `Poziom ${level}`;
  stage.innerHTML = "";
  MODES[key].run(level);
}
function solved(mistakes, custom) {
  keyHandler = null;
  const my = token;
  let extra = "";
  if (mistakes === 0) { stars++; streak++; bad = 0; tone([523, 659, 784]); }
  else { streak = 0; bad = mistakes >= 2 ? bad + 1 : 0; tone([440, 523]); }
  if (streak >= 3 && level < MODES[key].max) { level++; streak = 0; extra = " Poziom wyżej! 🚀"; }
  else if (bad >= 2 && level > 1) { level--; bad = 0; extra = " Poćwiczmy trochę spokojniej."; }
  save(key, level);
  setMsg((custom || (mistakes === 0 ? pick(PRAISE) : "Dobrze, że próbujesz dalej! 💪")) + extra);
  setTimeout(() => { if (my === token) nextTask(); }, 1900);
}
function endSession() {
  show("end");
  $("endTitle").textContent = stars >= 6 ? "Znakomicie!" : "Dobra robota!";
  $("endText").textContent = `${"⭐".repeat(stars)}${"☆".repeat(TASKS - stars)}  (${stars} z ${TASKS} za pierwszym razem) · Poziom ${level}`;
  tone([523, 659, 784, 1047]);
}

/* ---------- wspólny komponent: odpowiedź liczbowa ---------- */
document.addEventListener("keydown", e => keyHandler && keyHandler(e));
function numTask(html, answer, hint) {
  let val = "", mistakes = 0, done = false;
  stage.innerHTML = `<div class="q">${html}</div><div class="ans" id="ans">&nbsp;</div><div class="pad" id="pad"></div>`;
  const ans = $("ans");
  ["1","2","3","4","5","6","7","8","9","⌫","0","✔"].forEach(k => {
    const b = document.createElement("button");
    b.className = "key" + (k === "✔" ? " go" : ""); b.textContent = k; b.onclick = () => press(k);
    $("pad").appendChild(b);
  });
  keyHandler = e => {
    if (e.key === "Backspace") press("⌫");
    else if (e.key === "Enter") press("✔");
    else if (/^\d$/.test(e.key)) press(e.key);
  };
  function press(k) {
    if (done) return;
    if (k === "⌫") val = val.slice(0, -1);
    else if (k === "✔") { if (val) check(); return; }
    else if (val.length < 7) val += k;
    ans.innerHTML = val || "&nbsp;";
  }
  function check() {
    if (+val === answer) { done = true; ans.classList.add("ok"); solved(mistakes); return; }
    mistakes++; tone([330]); wobble(ans); val = "";
    setTimeout(() => ans.innerHTML = "&nbsp;", 400);
    if (mistakes >= 3) {
      done = true; setTimeout(() => { ans.textContent = answer; ans.classList.add("ok"); }, 450);
      solved(mistakes, `Odpowiedź to ${answer}. Następnym razem się uda!`);
    } else setMsg(mistakes === 2 && hint ? "Podpowiedź: " + hint : "Prawie! Spróbuj jeszcze raz 🙂");
  }
}

/* ---------- 1. Matematyka ---------- */
function genMath(l) {
  const B = '<span class="box">?</span>';
  let a, b, c, d;
  switch (l) {
    case 1: a = rnd(3, 11); b = rnd(2, 9);
      return Math.random() < .5 ? [`${a} + ${b}`, a + b] : [`${a + b} − ${b}`, a];
    case 2: a = rnd(12, 55); b = rnd(11, 40);
      return Math.random() < .5 ? [`${a} + ${b}`, a + b] : [`${a + b} − ${b}`, a];
    case 3: a = rnd(2, 10); b = rnd(2, 10); return [`${a} × ${b}`, a * b];
    case 4: a = rnd(2, 10); b = rnd(2, 10);
      if (Math.random() < .5) return [`${a * b} ÷ ${b}`, a];
      a = rnd(11, 15); return [`${a} × ${b}`, a * b];
    case 5: a = rnd(3, 9); b = rnd(3, 9); c = rnd(2, 9);
      return pick([
        [`${a} × ${b} + ${c}`, a * b + c],
        [`(${a} + ${b}) × ${c}`, (a + b) * c],
        [`${a * b} ÷ ${b} + ${c}`, a + c],
        [`${a} × ${b} − ${c}`, a * b - c]
      ]);
    case 6: a = rnd(12, 80); b = rnd(3, 9);
      return pick([
        [`${B} + ${b + 20} = ${a + b + 20}`, a],
        [`${B} × ${b} = ${a * b}`, a],
        [`${b} × ${B} = ${b * a}`, a],
        [`${a + b} − ${B} = ${a}`, b]
      ]);
    default: a = rnd(12, 25); b = rnd(3, 9); c = rnd(2, 9); d = rnd(2, 9);
      const e = rnd(200, 800), f = rnd(100, 400), k = rnd(11, 20);
      return pick([
        [`${a} × ${b}`, a * b],
        [`${e} + ${f}`, e + f],
        [`(${c} + ${d}) × ${b} − ${c}`, (c + d) * b - c],
        [`${k}²`, k * k]
      ]);
  }
}
function runMath(l) {
  const [q, a] = genMath(l);
  numTask(q + (q.includes("=") ? "" : " = ?"), a, "rozbij działanie na prostsze kroki");
}

/* ---------- 2. Ciągi liczb ---------- */
const arr = (n, f) => Array.from({ length: n }, (_, i) => f(i));
const SEQ = {
  add: () => { const d = rnd(2, 9), s = rnd(1, 20); return [arr(6, i => s + d * i), "O ile rośnie każda liczba?"]; },
  sub: () => { const d = rnd(2, 7), s = d * 6 + rnd(1, 8); return [arr(6, i => s - d * i), "O ile maleje każda liczba?"]; },
  mul: () => { const r = pick([2, 3]), s = rnd(1, 4); return [arr(6, i => s * r ** i), "Przez ile mnożymy każdą liczbę?"]; },
  alt: () => { const a = rnd(1, 5), b = rnd(2, 8), s = rnd(1, 10); let x = s; return [arr(7, i => (i ? x += (i % 2 ? a : b) : x)), "Różnice powtarzają się na przemian."]; },
  sq: () => { const k = rnd(1, 5); return [arr(6, i => (k + i) ** 2), "To kwadraty kolejnych liczb."]; },
  tri: () => { const k = rnd(1, 3); return [arr(6, i => (k + i) * (k + i + 1) / 2), "Różnice rosną o 1."]; },
  grow: () => { const s = rnd(1, 6), d = rnd(1, 3); let x = s; return [arr(7, i => (i ? x += d + i - 1 : x)), "Różnice między liczbami rosną."]; },
  fib: () => { const a = rnd(1, 4), b = rnd(2, 6); const t = [a, b]; while (t.length < 7) t.push(t[t.length - 1] + t[t.length - 2]); return [t, "Każda liczba to suma dwóch poprzednich."]; }
};
function runSeq(l) {
  const pools = { 1: ["add"], 2: ["sub", "mul"], 3: ["alt"], 4: ["sq", "tri"], 5: ["grow", "fib"], 6: Object.keys(SEQ) };
  const [s, hint] = SEQ[pick(pools[l])]();
  const hide = l < 6 ? s.length - 1 : rnd(2, s.length - 2);
  const shown = s.map((v, i) => i === hide ? '<span class="box">?</span>' : v).join(", ");
  numTask(shown, s[hide], hint);
}

/* ---------- 3. Ortografia ---------- */
const SP = {
  1: [["kr","ó","l","u"],["st","ó","ł","u"],["m","ó","zg","u"],["g","ó","ra","u"],["w","ó","zek","u"],["og","ó","rek","u"],["dr","ó","t","u"],
      ["kl","u","cz","ó"],["b","u","ty","ó"],["l","u","stro","ó"],["k","u","bek","ó"],["r","u","da","ó"]],
  2: [["","rz","eka","ż"],["mo","rz","e","ż"],["","rz","epa","ż"],["ryce","rz","","ż"],["","ż","aba","rz"],["","ż","yrafa","rz"],
      ["wie","ż","a","rz"],["je","ż","","rz"],["","ż","ółw","rz"],["","ż","uk","rz"]],
  3: [["","ch","leb","h"],["","h","erbata","ch"],["","h","amak","ch"],["","ch","mura","h"],["","h","ałas","ch"],["","ch","omik","h"],
      ["","h","otel","ch"],["","h","ipopotam","ch"],["u","ch","o","h"],["du","ch","","h"]],
  4: [["w","ą","ż","ę"],["r","ę","ka","ą"],["mi","ę","so","ą"],["zaj","ą","c","ę"],["pi","ę","ć","ą"],["d","ą","b","ę"],
      ["m","ą","ka","ę"],["g","ę","ś","ą"],["j","ę","zyk","ą"],["z","ą","b","ę"]]
};
function runSpell(l) {
  const [pre, ans, post, alt] = pick(l < 5 ? SP[l] : [].concat(SP[1], SP[2], SP[3], SP[4]));
  stage.innerHTML = `<div class="q">${pre}<span class="box">&nbsp;</span>${post}</div>
    <div style="margin-bottom:10px;opacity:.8">Którą pisownię wybierzesz?</div><div class="opts" id="opts"></div>`;
  let mistakes = 0, done = false;
  shuffle([ans, alt]).forEach(o => {
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = o;
    b.onclick = () => {
      if (done) return;
      if (o === ans) {
        done = true; $("opts").querySelectorAll("button").forEach(x => x.disabled = true);
        stage.querySelector(".q").innerHTML = `${pre}<span class="box" style="background:var(--ok)">${ans}</span>${post}`;
        solved(mistakes, mistakes ? `Poprawna pisownia: ${pre}${ans}${post}` : null);
      } else { mistakes++; b.disabled = true; tone([330]); wobble(b); setMsg("Spróbuj jeszcze raz 🙂"); }
    };
    $("opts").appendChild(b);
  });
}

/* ---------- 4. Rozsypanka literowa ---------- */
const WORDS = {
  1: ["lato", "zima", "rower", "kwiat", "ptak", "okno", "chmura"],
  2: ["planeta", "szkoła", "dinozaur", "samolot", "książka", "wiewiórka"],
  3: ["komputer", "pomarańcza", "czekolada", "biblioteka", "kosmonauta", "matematyka"],
  4: ["encyklopedia", "hipopotam", "tyranozaur", "astronomia", "przedszkole", "helikopter"]
};
function runAnagram(l) {
  const w = pick(WORDS[l]), letters = w.split("");
  let mix; do { mix = shuffle(letters); } while (mix.join("") === w);
  stage.innerHTML = `<div style="margin-bottom:10px;opacity:.8">Ułóż słowo z liter w kolejności:</div>
    <div class="slots" id="slots"></div><div class="tiles" id="tiles"></div>
    <button class="small" id="hintBtn">💡 Podpowiedź</button>`;
  let pos = 0, mistakes = 0;
  const slots = letters.map(() => { const s = document.createElement("div"); s.className = "slot"; $("slots").appendChild(s); return s; });
  const tiles = mix.map(ch => {
    const b = document.createElement("button"); b.className = "tile"; b.textContent = ch;
    b.onclick = () => {
      if (pos >= w.length) return;
      if (ch === w[pos]) {
        slots[pos].textContent = ch; pos++; b.disabled = true; tiles.forEach(t => t.classList.remove("hint")); tone([660]);
        if (pos === w.length) { slots.forEach(s => s.style.borderColor = "#7bb67f"); solved(mistakes); }
      } else { mistakes++; wobble(b); tone([330]); }
    };
    $("tiles").appendChild(b); return b;
  });
  $("hintBtn").onclick = () => {
    if (pos >= w.length) return;
    const t = tiles.find(t => !t.disabled && t.textContent === w[pos]);
    if (t) { t.classList.add("hint"); mistakes++; }
  };
}

/* ---------- 5. Zapamiętaj kolejność ---------- */
const COLORS = ["#f4a6a6", "#a6c8f4", "#a6e3b4", "#f4e1a6", "#d0b3ef", "#f4c4a1"];
function runMemory(l) {
  const nt = l < 4 ? 4 : 6, len = l + 2, my = token;
  const seq = arr(len, () => rnd(0, nt - 1));
  stage.innerHTML = `<div class="q" id="say">Patrz uważnie…</div><div class="seqgrid ${nt === 6 ? "six" : ""}" id="g"></div>`;
  let pos = 0, mistakes = 0, accept = false;
  const sts = arr(nt, i => {
    const b = document.createElement("button"); b.className = "st"; b.style.background = COLORS[i];
    b.onclick = () => click(i); $("g").appendChild(b); return b;
  });
  const lit = async (i, ms) => { sts[i].classList.add("lit"); tone([262 + i * 55]); await sleep(ms); sts[i].classList.remove("lit"); };
  async function play() {
    accept = false; pos = 0; $("say").textContent = "Patrz uważnie…";
    await sleep(900);
    for (const i of seq) { if (my !== token) return; await lit(i, 750); await sleep(350); }
    if (my !== token) return;
    $("say").textContent = "Twoja kolej! Powtórz kolejność."; accept = true;
  }
  async function click(i) {
    if (!accept) return;
    accept = false; await lit(i, 250);
    if (my !== token) return;
    if (i === seq[pos]) {
      pos++;
      if (pos === len) { $("say").textContent = "Bezbłędnie! ✔"; solved(mistakes); } else accept = true;
    } else { mistakes++; setMsg("Obejrzyjmy jeszcze raz 🙂"); await sleep(900); if (my === token) { setMsg(""); play(); } }
  }
  play();
}

/* ---------- 6. Znajdź inny ---------- */
const EASY = [["🍎", "🍅"], ["🐶", "🐺"], ["🌞", "🌝"], ["🔵", "🟣"], ["🍋", "🌽"]];
const HARD = [["b", "d"], ["p", "q"], ["m", "n"], ["6", "9"], ["O", "Q"], ["E", "F"], ["a", "o"], ["h", "n"], ["u", "v"], ["c", "e"]];
function runOdd(l) {
  const n = l + 2, [x, y] = (() => { const p = pick(l < 3 ? EASY : HARD); return Math.random() < .5 ? p : [p[1], p[0]]; })();
  const odd = rnd(0, n * n - 1);
  stage.innerHTML = `<div style="margin-bottom:10px;opacity:.8">Znajdź jeden inny znak. Nie spiesz się.</div><div class="oddgrid" id="og"></div>`;
  $("og").style.gridTemplateColumns = `repeat(${n}, 1fr)`;
  let mistakes = 0, done = false;
  for (let i = 0; i < n * n; i++) {
    const b = document.createElement("button"); b.className = "cell"; b.textContent = i === odd ? y : x;
    b.style.fontSize = `${Math.max(1.3, 3.4 - n * .3)}rem`;
    b.onclick = () => {
      if (done) return;
      if (i === odd) { done = true; b.classList.add("ok"); stage.querySelectorAll(".cell").forEach(c => c.disabled = c.disabled || c !== b); solved(mistakes); }
      else { mistakes++; b.disabled = true; tone([330]); setMsg("Szukaj dalej 🙂"); }
    };
    $("og").appendChild(b);
  }
}

/* ---------- menu ---------- */
const MODES = {
  math:    { name: "➕ Matematyka",         desc: "Rachunki, od prostych do łamigłówek", max: 7, run: runMath },
  seq:     { name: "🔢 Ciągi liczb",       desc: "Znajdź regułę i brakującą liczbę",   max: 6, run: runSeq },
  spell:   { name: "✏️ Ortografia",        desc: "ó/u, rz/ż, ch/h, ą/ę",               max: 5, run: runSpell },
  anagram: { name: "🔤 Rozsypanka",        desc: "Ułóż słowo z liter",                 max: 4, run: runAnagram },
  memory:  { name: "🎯 Zapamiętaj kolejność", desc: "Ćwiczenie pamięci i uwagi",       max: 7, run: runMemory },
  odd:     { name: "🔍 Znajdź inny",       desc: "Skupienie wzroku i uwagi",           max: 5, run: runOdd }
};
function buildMenu() {
  const g = $("menuGrid"); g.innerHTML = "";
  Object.entries(MODES).forEach(([k, m]) => {
    const c = document.createElement("div"); c.className = "card";
    c.innerHTML = `<button class="go">${m.name}</button><div class="desc">${m.desc}</div>
      <div class="lv"><button aria-label="Niższy poziom">▼</button><span>Poziom ${load(k)}</span><button aria-label="Wyższy poziom">▲</button></div>`;
    const [go] = c.querySelectorAll(".go"), [dn, up] = c.querySelectorAll(".lv button");
    go.onclick = () => startMode(k);
    dn.onclick = () => { save(k, Math.max(1, load(k) - 1)); buildMenu(); };
    up.onclick = () => { save(k, Math.min(m.max, load(k) + 1)); buildMenu(); };
    g.appendChild(c);
  });
}
function toMenu() { token++; keyHandler = null; buildMenu(); show("menu"); }
$("back").onclick = $("tomenu").onclick = toMenu;
$("again").onclick = () => startMode(key);
$("snd").onclick = () => { sound = !sound; $("snd").textContent = sound ? "🔊 Dźwięk" : "🔇 Cisza"; };
buildMenu();
</script>
</body>
</html>
